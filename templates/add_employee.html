<!DOCTYPE html>
<html>
<head>
    <title>Add New Employee</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>💼 Payroll System</h2>
            <p>Enterprise Management</p>
        </div>
        <ul class="sidebar-nav">
            <li><a href="/"><i>📊</i>Dashboard</a></li>
            <li><a href="/add" class="active"><i>➕</i>Add Employee</a></li>
            <li><a href="/attendance"><i>📋</i>Attendance</a></li>
            <li><a href="/payroll"><i>💰</i>Payroll</a></li>
            <li><a href="/reports"><i>📈</i>Reports</a></li>
            <li><a href="/logout"><i>🚪</i>Logout</a></li>
        </ul>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>➕ Add New Employee</h1>
            <p>Register a new employee in the system</p>
        </div>

        <div class="content-section">
            <form method="POST" onsubmit="return validateForm()">
                <h3 style="color: #667eea; margin-bottom: 20px;">Personal Information</h3>

                <div class="form-group">
                    <div class="form-item">
                        <label>Full Name *</label>
                        <input type="text" name="name" required placeholder="Enter full name">
                    </div>
                    <div class="form-item">
                        <label>Email *</label>
                        <input type="email" name="email" required placeholder="Enter email address">
                    </div>
                </div>

                <div class="form-group">
                    <div class="form-item">
                        <label>Gender *</label>
                        <select name="gender" required>
                            <option value="">-- Select Gender --</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-item">
                        <label>Date of Birth *</label>
                        <input type="date" name="dob" required>
                    </div>
                </div>

                <div class="form-group">
                    <div class="form-item">
                        <label>Age *</label>
                        <input type="number" name="age" required min="18" max="100" placeholder="Enter age">
                    </div>
                    <div class="form-item"></div>
                </div>

                <div class="form-group">
                    <div class="form-item">
                        <label>Phone Number *</label>
                        <input type="text" name="phone" required placeholder="Enter phone number">
                    </div>
                    <div class="form-item">
                        <label>Address *</label>
                        <input type="text" name="address" required placeholder="Enter address">
                    </div>
                </div>

                <h3 style="color: #667eea; margin: 30px 0 20px 0;">Employment Information</h3>

                <div class="form-group">
                    <div class="form-item">
                        <label>Designation/Position *</label>
                        <select name="designation" required>
                            <option value="">-- Select Position --</option>
                            <option value="Developer">Developer</option>
                            <option value="Designer">Designer</option>
                            <option value="Manager">Manager</option>
                            <option value="HR">HR Executive</option>
                            <option value="Accountant">Accountant</option>
                            <option value="Director">Director</option>
                            <option value="Analyst">Analyst</option>
                        </select>
                    </div>
                    <div class="form-item">
                        <label>Department *</label>
                        <select name="dept_id" required>
                            <option value="">-- Select Department --</option>
                            {% for dept in departments %}
                            <option value="{{ dept[0] }}">{{ dept[1] }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <div class="form-item">
                        <label>Years of Experience *</label>
                        <input type="number" name="experience" required min="0" placeholder="Enter experience in years">
                    </div>
                    <div class="form-item">
                        <label>Date of Joining *</label>
                        <input type="date" name="hire_date" required>
                    </div>
                </div>

                <h3 style="color: #667eea; margin: 30px 0 20px 0;">Salary Information</h3>

                <div class="form-group">
                    <div class="form-item">
                        <label>Basic Salary (₹) *</label>
                        <input type="number" name="salary" required step="0.01" min="0" placeholder="Enter basic salary">
                    </div>
                    <div class="form-item">
                        <label>Employee Status *</label>
                        <select name="status" required>
                            <option value="">-- Select Status --</option>
                            <option value="Active">Active</option>
                            <option value="On Leave">On Leave</option>
                            <option value="Probation">Probation</option>
                        </select>
                    </div>
                </div>

                <div style="text-align: center; margin-top: 30px;">
                    <button type="submit" class="btn btn-primary">✅ Add Employee</button>
                    <a href="/" class="btn btn-secondary" style="margin-left: 10px;">❌ Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
function validateForm() {
    const phone = document.querySelector('input[name="phone"]').value;
    if (!/^\d{10}$/.test(phone)) {
        alert('Please enter a valid 10-digit phone number');
        return false;
    }
    return true;
}
</script>

</body>
</html>
