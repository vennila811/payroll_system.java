<!DOCTYPE html>
<html>
<head>
    <title>Payroll Login</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .login-shell {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #173b57 0%, #1e6f78 100%);
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 450px;
        }

        .login-card h1 {
            color: #173b57;
            margin-bottom: 10px;
            font-size: 24px;
        }

        .login-card p {
            color: #666;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .error {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .role-selection {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
        }

        .role-btn {
            flex: 1;
            padding: 10px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            color: #333;
            text-align: center;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 40px;
        }

        .role-btn:hover {
            border-color: #173b57;
            color: #173b57;
        }

        .role-btn.active {
            background-color: #173b57;
            color: white;
            border-color: #173b57;
        }

        .login-form {
            display: flex;
            flex-direction: column;
        }

        .login-form label {
            margin-top: 15px;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        .login-form input {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .login-form input:focus {
            outline: none;
            border-color: #173b57;
            box-shadow: 0 0 5px rgba(23, 59, 87, 0.2);
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
            font-weight: 500;
        }

        .btn-primary {
            background-color: #173b57;
            color: white;
            width: 100%;
            margin-top: 20px;
        }

        .btn-primary:hover {
            background-color: #102a3c;
        }

        .divider {
            text-align: center;
            margin: 25px 0;
            position: relative;
        }

        .divider:before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 1px;
            background: #ddd;
        }

        .divider span {
            background: white;
            padding: 0 10px;
            position: relative;
            color: #999;
            font-size: 12px;
        }

        .employee-link {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .employee-link p {
            margin: 0 0 10px 0;
            color: #666;
            font-size: 13px;
        }

        .employee-link a {
            color: #173b57;
            text-decoration: none;
            font-weight: 600;
        }

        .employee-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="login-shell">
    <div class="login-card">
        <h1>Payroll System</h1>
        <p>Administrator Login</p>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST" class="login-form">
            <label>Username</label>
            <input type="text" name="username" required placeholder="Enter admin username" autofocus>

            <label>Password</label>
            <input type="password" name="password" required placeholder="Enter password">

            <button type="submit" class="btn btn-primary">Login</button>
        </form>

        <div class="employee-link">
            <p>Are you an employee?</p>
            <a href="/employee-login">Click here to login to Employee Portal</a>
        </div>
    </div>
</div>

</body>
</html>
