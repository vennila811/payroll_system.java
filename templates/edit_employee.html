<!DOCTYPE html>
<html>
<head>
    <title>Edit Employee</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>💼 Payroll System</h2>
            <p>Enterprise Management</p>
        </div>
        <ul class="sidebar-nav">
            <li><a href="/"><i>📊</i>Dashboard</a></li>
            <li><a href="/add"><i>➕</i>Add Employee</a></li>
            <li><a href="/attendance"><i>📋</i>Attendance</a></li>
            <li><a href="/payroll"><i>💰</i>Payroll</a></li>
            <li><a href="/reports"><i>📈</i>Reports</a></li>
            <li><a href="/logout"><i>🚪</i>Logout</a></li>
        </ul>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>✏️ Edit Employee</h1>
            <p>Update employee information</p>
        </div>

        <div class="content-section">
            <form method="POST" onsubmit="return validateForm()">
                <h3 style="color: #9094a7; margin-bottom: 20px;">Personal Information</h3>

                <div class="form-group">
                    <div class="form-item">
                        <label>Full Name *</label>
                        <input type="text" name="name" value="{{ employee[1] }}" required placeholder="Enter full name">
                    </div>
                    <div class="form-item">
                        <label>Email *</label>
                        <input type="email" name="email" value="{{ employee[6] }}" required placeholder="Enter email address">
                    </div>
                </div>

                <div class="form-group">
                    <div class="form-item">
                        <label>Gender *</label>
                        <select name="gender" required>
                            <option value="">-- Select Gender --</option>
                            <option value="Male" {% if employee[2] == 'Male' %}selected{% endif %}>Male</option>
                            <option value="Female" {% if employee[2] == 'Female' %}selected{% endif %}>Female</option>
                            <option value="Other" {% if employee[2] == 'Other' %}selected{% endif %}>Other</option>
                        </select>
                    </div>
                    <div class="form-item">
                        <label>Date of Birth *</label>
                        <input type="date" name="dob" value="{{ employee[3] }}" required>
                    </div>
                </div>

                <div class="form-group">
                    <div class="form-item">
                        <label>Phone Number *</label>
                        <input type="text" name="phone" value="{{ employee[5] }}" required placeholder="Enter phone number">
                    </div>
                    <div class="form-item">
                        <label>Address *</label>
                        <input type="text" name="address" value="{{ employee[7] }}" required placeholder="Enter address">
                    </div>
                </div>

                <h3 style="color: #b8c0e6; margin: 30px 0 20px 0;">Employment Information</h3>

                <div class="form-group">
                    <div class="form-item">
                        <label>Designation/Position *</label>
                        <select name="designation" required>
                            <option value="">-- Select Position --</option>
                            <option value="Developer" {% if employee[8] == 'Developer' %}selected{% endif %}>Developer</option>
                            <option value="Designer" {% if employee[8] == 'Designer' %}selected{% endif %}>Designer</option>
                            <option value="Manager" {% if employee[8] == 'Manager' %}selected{% endif %}>Manager</option>
                            <option value="HR" {% if employee[8] == 'HR' %}selected{% endif %}>HR Executive</option>
                            <option value="Accountant" {% if employee[8] == 'Accountant' %}selected{% endif %}>Accountant</option>
                            <option value="Director" {% if employee[8] == 'Director' %}selected{% endif %}>Director</option>
                            <option value="Analyst" {% if employee[8] == 'Analyst' %}selected{% endif %}>Analyst</option>
                        </select>
                    </div>
                    <div class="form-item">
                        <label>Department *</label>
                        <select name="dept_id" required>
                            <option value="">-- Select Department --</option>
                            {% for dept in departments %}
                            <option value="{{ dept[0] }}" {% if employee[9] == dept[0] %}selected{% endif %}>{{ dept[1] }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <div class="form-item">
                        <label>Years of Experience *</label>
                        <input type="number" name="experience" value="{{ employee[4] }}" required min="0" placeholder="Enter experience in years">
                    </div>
                    <div class="form-item">
                        <label>Date of Joining *</label>
                        <input type="date" name="hire_date" value="{{ employee[10] }}" required>
                    </div>
                </div>

                <h3 style="color: #9195a3; margin: 30px 0 20px 0;">Salary Information</h3>

                <div class="form-group">
                    <div class="form-item">
                        <label>Basic Salary (₹) *</label>
                        <input type="number" name="salary" value="{{ employee[11] }}" required step="0.01" min="0" placeholder="Enter basic salary">
                    </div>
                    <div class="form-item">
                        <label>Employee Status *</label>
                        <select name="status" required>
                            <option value="">-- Select Status --</option>
                            <option value="Active" {% if employee[12] == 'Active' %}selected{% endif %}>Active</option>
                            <option value="On Leave" {% if employee[12] == 'On Leave' %}selected{% endif %}>On Leave</option>
                            <option value="Probation" {% if employee[12] == 'Probation' %}selected{% endif %}>Probation</option>
                        </select>
                    </div>
                </div>

                <div style="text-align: center; margin-top: 30px;">
                    <button type="submit" class="btn btn-primary">✅ Update Employee</button>
                    <a href="/" class="btn btn-secondary" style="margin-left: 10px;">❌ Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
function validateForm() {
    const phone = document.querySelector('input[name="phone"]').value;
    if (!/^\d{10}$/.test(phone)) {
        alert('Please enter a valid 10-digit phone number');
        return false;
    }
    return true;
}
</script>

</body>
</html>
